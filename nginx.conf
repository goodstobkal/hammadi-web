server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Caddy terminates TLS and proxies over http, so nginx would build
    # redirect Locations as http://. Relative ones keep the scheme.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Each route is prerendered to its own file, so serve that when it exists.
    # Anything else is an old URL: 404 -> 404.html, which redirects to the home
    # page (mirrors how GitHub Pages serves this site).
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
